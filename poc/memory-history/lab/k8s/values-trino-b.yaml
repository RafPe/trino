# Cluster B (release trino-b): predictor-b and database history_b.

# Resource names trino-b, trino-b-coordinator, trino-b-worker (the chart default is trino-b-trino).
fullnameOverride: trino-b

server:
  keda:
    # For an External metric with an AverageValue target, the HPA sets
    # replicas = ceil(metric / target). Target 1 gives replicas == workers.
    triggers:
      - type: metrics-api
        metricType: AverageValue
        metadata:
          url: "http://predictor-b.{{ .Release.Namespace }}.svc:8090/v1/required-workers"
          format: json
          valueLocation: workers
          targetValue: "1"

coordinator:
  additionalConfigFiles:
    memory-history-listener.properties: |
      event-listener.name=memory-history
      memory-history.db.url=jdbc:postgresql://postgres.{{ .Release.Namespace }}.svc:5432/history_b
      memory-history.db.user=trino
      memory-history.db.password=trino
