# Based on poc/memory-history/compose/etc/coordinator/config.properties.
coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory-per-node=${ENV:QUERY_MAX_MEMORY_PER_NODE}
query.max-memory=${ENV:QUERY_MAX_MEMORY}
# Trino Gateway and Envoy do not rewrite nextUri. Trino builds it from X-Forwarded-* or Host.
http-server.process-forwarded=true
