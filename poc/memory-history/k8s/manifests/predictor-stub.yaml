# Stand-in for the predictor (PLAN.md Contract 3), used until the real image exists.
# Serves GET /v1/required-workers -> {"workers": N, "reservations": 0} and GET /v1/health.
# N is read on every request from ConfigMap `predictor-stub` key `workers`:
#   kubectl patch configmap predictor-stub -p '{"data":{"workers":"4"}}'
# Service `predictor` (port 8090, predictor-service.yaml) selects this stub or the real predictor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: predictor-stub
data:
  workers: "2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: predictor-stub-code
data:
  stub.py: |
    import json, sys, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PATH = "/config/workers"
    last = None

    def workers():
        global last
        with open(PATH) as f:
            value = int(f.read().strip())
        if value != last:
            print(f"{time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())} workers changed {last} -> {value}", flush=True)
            last = value
        return value

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/v1/required-workers":
                self.reply(200, {"workers": workers(), "reservations": 0})
            elif self.path == "/v1/health":
                self.reply(200, {"status": "ok"})
            else:
                self.reply(404, {"error": "not found"})

        def reply(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, *args):
            pass

    workers()
    ThreadingHTTPServer(("", 8090), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor-stub
  labels:
    app.kubernetes.io/name: predictor
    app.kubernetes.io/component: stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: predictor
      app.kubernetes.io/component: stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predictor
        app.kubernetes.io/component: stub
    spec:
      containers:
        - name: stub
          image: python:3.13-alpine
          imagePullPolicy: Never
          command: ["python3", "-u", "/code/stub.py"]
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # Mount the whole directory (no subPath) so ConfigMap updates propagate.
            - name: config
              mountPath: /config
            - name: code
              mountPath: /code
      volumes:
        - name: config
          configMap:
            name: predictor-stub
        - name: code
          configMap:
            name: predictor-stub-code
