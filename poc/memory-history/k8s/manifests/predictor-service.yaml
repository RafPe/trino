# Selects either the real predictor (predictor.yaml) or the stub (predictor-stub.yaml);
# up.sh runs exactly one of them.
apiVersion: v1
kind: Service
metadata:
  name: predictor
spec:
  selector:
    app.kubernetes.io/name: predictor
  ports:
    - name: http
      port: 8090
      targetPort: http
